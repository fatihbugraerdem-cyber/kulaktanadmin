<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifre Sıfırlama | Kulaktan</title>

<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kulaktan.css">
<script>document.documentElement.className+=" js"</script>
</head>
<body class="app-body" style="padding-top:0">
<div class="auth">
  <aside class="auth-aside">
  <div class="arcs" aria-hidden="true"><svg viewBox="0 0 420 400" aria-hidden="true" focusable="false"><path pathLength="1" style="--i:0" stroke-width="13" d="M77.1 140.6A70 70 0 0 1 77.1 259.4"/><path pathLength="1" style="--i:1" stroke-width="11" d="M108.9 89.8A130 130 0 0 1 108.9 310.2"/><path pathLength="1" style="--i:2" stroke-width="9" d="M140.7 38.9A190 190 0 0 1 140.7 361.1"/><path pathLength="1" style="--i:3" stroke-width="7" d="M172.5 -12.0A250 250 0 0 1 172.5 412.0"/><path pathLength="1" style="--i:4" stroke-width="5" d="M204.3 -62.9A310 310 0 0 1 204.3 462.9"/></svg></div>
  <a href="/" class="brand" aria-label="Kulaktan ana sayfa"><img src="/assets/logo-mark-white.png" alt="" width="21" height="34">kulaktan</a>
  <div>
    <h2>Yeni Şifre Belirle</h2>
    <p>E-postanıza gelen bağlantı üzerinden buradasınız. Yeni şifrenizi girin.</p>
    <a class="back" href="/">Ana sayfaya dön</a>
  </div>
  <span class="tiny" style="position:relative;opacity:.7">Bu oturum şifreli bağlantı üzerinden açılır.</span>
</aside>
  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Yeni Şifre Belirle</h1>
      <p class="mt-2">E-postanıza gelen bağlantı üzerinden buradasınız. Yeni şifrenizi girin.</p>
      <form id="resetForm" class="form" novalidate>
        <div class="field"><label for="newPassword">Yeni Şifre</label><input type="password" id="newPassword" placeholder="En az 8 karakter" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label for="newPassword2">Yeni Şifre (Tekrar)</label><input type="password" id="newPassword2" placeholder="Şifrenizi tekrar girin" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Şifreyi Güncelle</button>
      </form>
      <p id="msg" class="form-msg hidden" role="status"></p>
      <p class="mt-4 small muted">
        <a href="/admin.html" class="link">Kurumsal Giriş</a> ·
        <a href="/uzman.html" class="link">Uzman Girişi</a> ·
        <a href="/board.html" class="link">YK Girişi</a></p>
    </div>
  </main>
</div>
<script src="/assets/kulaktan.js"></script>
<script src="/assets/pages/reset-password.js"></script>
</body>
</html>
